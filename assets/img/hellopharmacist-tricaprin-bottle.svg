      <text x="180" y="407" fill="#fff" font-size="20" font-weight="900">1,000mg</text>
      <text x="180" y="451" fill="#0b4a7f" font-size="15" font-weight="800">Pure C10 • No Blends</text>
      <text x="180" y="474" fill="#0b4a7f" font-size="15" font-weight="800">COA Verified</text>
